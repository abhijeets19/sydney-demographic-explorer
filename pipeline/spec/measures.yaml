# Measure spec: app measures -> ABS 2021 GCP DataPack short-header columns.
#
# Every `src` is resolved against Metadata_2021_GCP_DataPack_R1_R2.xlsx at build time
# (table family + short name must exist and be unique). A list `src` is summed.
# The resolved Long descriptors are written into schema.json for review.
#
# weight: p = Mesh Block person weight, d = Mesh Block dwelling weight.
# universe: what one unit of the column counts.
# brackets: `lo` inclusive / `hi` exclusive in the table's own units; hi: null = open-ended.
# role: `value` (default) | `notstated` (shown but excluded from shares and medians)

version: 1

groups:
  # ---------------------------------------------------------------- People
  - id: sex
    tab: people
    table: G01
    universe: persons
    weight: p
    label: Persons by sex
    columns:
      - { key: m, label: Male,   src: Tot_P_M }
      - { key: f, label: Female, src: Tot_P_F }

  - id: person_flags
    tab: people
    table: G01
    universe: persons
    weight: p
    label: Selected person characteristics
    columns:
      - { key: born_aus,   label: Born in Australia,              src: Birthplace_Australia_P }
      - { key: born_os,    label: Born overseas,                  src: Birthplace_Elsewhere_P }
      - { key: lang_eng,   label: English only at home,           src: Lang_used_home_Eng_only_P }
      - { key: lang_oth,   label: Other language at home,         src: Lang_used_home_Oth_Lang_P }
      - { key: indigenous, label: Aboriginal and/or Torres Strait Islander, src: Indigenous_P_Tot_P }
      - { key: citizen,    label: Australian citizen,             src: Australian_citizen_P }

  - id: dwellings
    tab: people
    table: G36
    universe: dwellings
    weight: d
    label: Private dwellings
    columns:
      - { key: opd,        label: Occupied private dwellings,       src: OPDs_Tot_OPDs_Dwellings }
      - { key: unocc,      label: Unoccupied private dwellings,     src: Unoccupied_PDs_Dwgs }
      - { key: opd_psns,   label: Persons in occupied private dwellings, src: OPDs_Tot_OPDs_Persons, universe: persons }

