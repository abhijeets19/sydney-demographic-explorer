# Map display metrics baked into the Mesh Block tiles.
# level: mb = true Mesh Block value; sa1 = the SA1's value drawn on its MBs.
metrics:
  - { key: density,       label: Population density,      unit: "persons/km²", level: mb,  scale: log }
  - { key: dwell_density, label: Dwelling density,        unit: "dwellings/km²", level: mb, scale: log }
  - { key: median_age,    label: Median age (interpolated), unit: years,        level: sa1, scale: linear }
  - { key: pct_renting,   label: Renting,                  unit: "% of households", level: sa1, scale: linear }
  - { key: pct_apartment, label: Apartments,               unit: "% of dwellings",  level: sa1, scale: linear }
  - { key: pct_born_os,   label: Born overseas,            unit: "% of persons",    level: sa1, scale: linear }
  - { key: pct_lang_oth,  label: Other language at home,   unit: "% of persons",    level: sa1, scale: linear }
  - { key: hh_size,       label: Persons per household,    unit: persons,           level: sa1, scale: linear }
