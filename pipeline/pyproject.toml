[project]
name = "censusx"
version = "0.1.0"
description = "Data pipeline for the Sydney Demographic Explorer (ABS 2021 Census, MB-weighted SA1 apportionment)"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
censusx = "censusx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["censusx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
